[package]
name = "SigmaOS-releng"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS releng component"

[lib]
name = "releng"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
